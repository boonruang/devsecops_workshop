replicaCount: 2

image:
  # pipeline จะ --set image.repository / image.tag ให้ตรงกับที่ push เข้า registry
  repository: localhost:5000/workshop/sample-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
